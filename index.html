
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Rimjhim 🤍</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(
        135deg,
        #180713,
        #4b102d,
        #28103f,
        #160a20
    );
    font-family: Georgia, serif;
    color: white;
}

/* Background falling LOVE */

.rain {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.love {
    position: absolute;
    top: -60px;
    color: #ffb6d5;
    opacity: 0.65;
    font-size: 18px;
    font-weight: bold;
    animation: fall linear infinite;
    text-shadow: 0 0 12px #ff4f91;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    15% { opacity: 0.8; }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Main area */

.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Gift box */

.gift {
    position: relative;
    width: 150px;
    height: 120px;
    background: linear-gradient(135deg, #8e1749, #4b103c);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 35px #ff347e66;
    transition: transform 0.4s;
    margin-top: 45px;
}

.gift:hover {
    transform: scale(1.06);
}

.gift::before {
    content: "";
    position: absolute;
    width: 25px;
    height: 120px;
    background: #d7a0c7;
    left: 62px;
}

.lid {
    position: absolute;
    width: 170px;
    height: 32px;
    background: linear-gradient(135deg, #c02e70, #741747);
    left: -10px;
    top: -30px;
    border-radius: 7px;
    transition: 0.8s;
    z-index: 3;
}

.lid::before {
    content: "🎀";
    position: absolute;
    font-size: 32px;
    left: 65px;
    top: -27px;
}

.gift-text {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 145px;
    font-size: 19px;
    letter-spacing: 2px;
    color: #ffd4e5;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ff8ab7; }
    to { text-shadow: 0 0 20px #ff4f91; }
}

/* Opening animation */

.gift.open .lid {
    transform: translateY(-90px) rotate(-25deg);
    opacity: 0;
}

.gift.open {
    animation: disappear 1s forwards;
}

@keyframes disappear {
    to {
        opacity: 0;
        transform: scale(0.5);
    }
}

/* Flowers */

.flowers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
}

.flower {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 32px;
    opacity: 0;
    animation: bloom 3.5s ease-out forwards;
}

@keyframes bloom {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(1.3);
        opacity: 0;
    }
}

/* Final message */

.message {
    position: relative;
    z-index: 5;
    text-align: center;
    opacity: 0;
    transform: translateY(25px);
    transition: all 1.5s ease;
    display: none;
}

.message.show {
    display: block;
    animation: appear 1.5s forwards;
}

@keyframes appear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message h1 {
    color: #ffb6d5;
    font-size: clamp(25px, 6vw, 42px);
    margin-bottom: 25px;
    text-shadow: 0 0 20px #ff4f91;
}

.message p {
    font-size: clamp(17px, 4vw, 23px);
    line-height: 2;
    color: #ffe3ee;
    letter-spacing: 1px;
}

.heart {
    font-size: 32px;
    margin-top: 20px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.3); }
}

/* Mobile */

@media (max-width: 480px) {
    .message h1 {
        font-size: 27px;
    }

    .message p {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="rain" id="rain"></div>

<div class="container">

    <div class="gift" id="gift" onclick="openGift()">
        <div class="lid"></div>
        <div class="gift-text" id="giftText">
            এটা খুলো 🤍
        </div>
    </div>

    <div class="flowers" id="flowers"></div>

    <div class="message" id="message">
        <h1>I love you Rimjhim 🤍</h1>

        <p>
            I love you forever<br>
            One day we'll be together
        </p>

        <div class="heart">🤍</div>
    </div>

</div>

<script>

// Falling LOVE background

const rain = document.getElementById("rain");

const colors = [
    "#800020",
    "#DC143C",
    "#FF1744",
    "#9B30FF",
    "#C77DFF",
    "#FFB6D5"
];

for (let i = 0; i < 65; i++) {

    const love = document.createElement("div");

    love.className = "love";

    love.innerHTML =
        Math.random() > 0.5 ? "LOVE ♥" : "♥";

    love.style.left = Math.random() * 100 + "%";

    love.style.color =
        colors[Math.floor(Math.random() * colors.length)];

    love.style.fontSize =
        (12 + Math.random() * 17) + "px";

    love.style.animationDuration =
        (5 + Math.random() * 9) + "s";

    love.style.animationDelay =
        (-Math.random() * 12) + "s";

    rain.appendChild(love);
}


// Open Gift

let opened = false;

function openGift() {

    if (opened) return;

    opened = true;

    const gift = document.getElementById("gift");
    const giftText = document.getElementById("giftText");
    const flowers = document.getElementById("flowers");
    const message = document.getElementById("message");

    giftText.style.display = "none";

    gift.classList.add("open");

    // Flowers burst out

    const flowerEmojis = [
        "🌸", "🌷", "🌹", "🌺",
        "💐", "🌼", "🪷", "🌻"
    ];

    for (let i = 0; i < 55; i++) {

        const flower = document.createElement("div");

        flower.className = "flower";

        flower.innerHTML =
            flowerEmojis[
                Math.floor(Math.random() * flowerEmojis.length)
            ];

        flower.style.setProperty(
            "--x",
            (Math.random() - 0.5) * 650 + "px"
        );

        flower.style.setProperty(
            "--y",
            (Math.random() - 0.5) * 650 + "px"
        );

        flower.style.setProperty(
            "--r",
            Math.random() * 720 + "deg"
        );

        flower.style.animationDelay =
            Math.random() * 1.2 + "s";

        flowers.appendChild(flower);
    }

    // Message appears after flowers

    setTimeout(() => {

        gift.style.display = "none";

        flowers.style.display = "none";

        message.classList.add("show");

    }, 5500);

}

</script>

</body>
</html>
